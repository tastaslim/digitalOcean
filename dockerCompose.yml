# Full distributed stack for testing the proxy like production:
#   app        — FastAPI proxy (publish side): serves /v1/chat, publishes
#                shadow events to SNS, stores primary response in S3.
#   worker     — standalone ShadowWorker (consume side): long-polls SQS,
#                calls the candidate LLM, runs comparison. Scale with --scale.
#   postgres   — durable mismatch + shadow_tasks checkpoint store.
#   redis      — distributed metrics/runtime-config cache.
#   localstack — SNS + SQS + S3 emulator (AWS-compatible).
#
# Bring up:   docker compose -f dockerCompose.yml up --build
# Tear down:  docker compose -f dockerCompose.yml down -v

# ── Shared backend wiring (anchored into both app and worker) ──────────────
x-aws-env: &aws-env
  # Persistent DB
  DB_BACKEND: postgres
  DATABASE_URL: postgresql://shadow:shadow@postgres:5432/shadow

  # Distributed cache
  CACHE_BACKEND: redis
  REDIS_URL: redis://redis:6379

  # Blob storage (archives) via LocalStack S3
  STORAGE_BACKEND: s3
  S3_BUCKET: shadow-events
  S3_PREFIX: shadow-events

  # Distributed queue via LocalStack SNS + SQS
  QUEUE_BACKEND: sqs
  # Deterministic LocalStack ARNs/URLs created by scripts/localstack-init.sh
  SNS_SHADOW_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:shadow-events
  SQS_QUEUE_URL: http://localstack:4566/000000000000/shadow-tasks

  # AWS / LocalStack credentials + endpoint
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566

services:
  # ── Application (publish side) ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-shadow-proxy:latest
    ports:
      - "8000:8000"

    # Base config (LLM keys, model names) comes from cloud.env; the anchor
    # below overrides the backend selection to target the containerised services.
    env_file:
      - cloud.env
    environment:
      <<: *aws-env

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Shadow worker (consume side) ───────────────────────────────────────────
  # Separate process so the candidate LLM call never shares the request path.
  # Scale horizontally:  docker compose -f dockerCompose.yml up --scale worker=3
  worker:
    image: llm-shadow-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]

    env_file:
      - cloud.env
    environment:
      <<: *aws-env

    # The worker is an SQS consumer with no HTTP server, so the image's
    # HTTP HEALTHCHECK does not apply — disable it. Liveness for a queue
    # consumer is better handled by orchestrator restarts (restart policy
    # below) or a queue-depth alarm than by an in-container probe.
    healthcheck:
      disable: true

    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      app:
        condition: service_started

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (CACHE_BACKEND=redis) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── PostgreSQL (DB_BACKEND=postgres) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: shadow
      POSTGRES_DB: shadow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow -d shadow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── LocalStack (SNS + SQS + S3) ───────────────────────────────────────────
  # scripts/localstack-init.sh runs on startup and creates:
  #   - SNS topic:  shadow-events
  #   - SQS queue:  shadow-tasks  (subscribed to the topic)
  #   - S3 bucket:  shadow-events
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,sns,s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Path-style queue URLs (http://localstack:4566/000000000000/shadow-tasks)
      # so the deterministic SQS_QUEUE_URL above resolves on the docker network.
      SQS_ENDPOINT_STRATEGY: path
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  localstack_data:
    driver: local
