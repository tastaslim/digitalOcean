name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    # Required settings fields — real API keys are never needed because
    # all LLM HTTP calls are mocked at the _callLlm level in the test suite.
    env:
      PRIMARY_LLM_BASE_URL: https://inference.do-ai.run/v1
      PRIMARY_LLM_MODEL: openai-gpt-oss-120b
      CANDIDATE_LLM_BASE_URL: https://inference.do-ai.run/v1
      CANDIDATE_LLM_MODEL: openai-gpt-oss-120b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
